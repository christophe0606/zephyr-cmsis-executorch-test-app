# Use the CMSIS-ExecuTorch module instead of the upstream runtime build.
CONFIG_EXECUTORCH=n
CONFIG_CMSIS_EXECUTORCH=y

# Machine Learning:ExecuTorch:Runtime
CONFIG_CMSIS_EXECUTORCH_RUNTIME=y
# Machine Learning:ExecuTorch:Kernel Utils
CONFIG_CMSIS_EXECUTORCH_KERNEL_UTILS=y
# Machine Learning:ExecuTorch:Kernel Registration
CONFIG_CMSIS_EXECUTORCH_KERNEL_REGISTRATION=y
# Machine Learning:ExecuTorch:Backend EthosU
CONFIG_CMSIS_EXECUTORCH_BACKEND_ETHOS_U=y

# Equivalent to the CMSIS AI layer's ET_LOG_ENABLED: 0.
CONFIG_CMSIS_EXECUTORCH_LOG_ENABLED=n
