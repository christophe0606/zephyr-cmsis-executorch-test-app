# M55_HP boot address used by the board's existing Alif boot configuration.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x200000

# E8 NPU-HG: Ethos-U85 with 256 MACs per cycle.
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U85_256=y
CONFIG_ETHOS_U_ARM=y

# The Zephyr Ethos-U integration allocates its mutex and semaphores from this heap.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_LOG=y
CONFIG_ETHOS_U_LOG_LEVEL_INF=y
